<title>תשחץ פסיכומטרי — אוצר מילים בשלבים</title>
<style>
/* One committed world: the dark printed-grid look of a Hebrew arrowword app. */
:root{
  --bg:#000000; --panel:#1C1C1E; --panel-2:#2C2C2E; --sheet:#151517;
  --cell:#2C2C2E; --block:#000000; --line:#6E6E73;
  --clue-bg:#8E8E93; --clue-ink:#FFFFFF;
  --ink:#FFFFFF; --ink-2:#AEAEB2; --ink-3:#8A8A8E;
  --accent:#0A84FF; --accent-soft:#12365F;
  --good:#30D158; --bad:#FF453A; --amber:#FFD60A;
  --size:44px;
  --display:"New Peninim MT","Frank Ruehl CLM","David","Arial Hebrew",system-ui,serif;
  --ui:"Arial Hebrew","Assistant","Heebo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--ui);direction:rtl;-webkit-text-size-adjust:100%;
  overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.screen{display:none}
.screen.on{display:block}
.wrap{max-width:1000px;margin:0 auto;padding:0 14px 48px}

/* ---------- app bar ---------- */
.bar{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid #000}
.bar-in{max-width:1000px;margin:0 auto;height:52px;padding:0 12px;display:flex;align-items:center;gap:10px}
.back{display:flex;align-items:center;gap:3px;color:var(--accent);font-size:17px}
.back svg{width:12px;height:19px;fill:none;stroke:var(--accent);stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round}
.bar-title{position:absolute;left:0;right:0;text-align:center;font-size:17px;font-weight:600;
  pointer-events:none;font-variant-numeric:tabular-nums}
.bar-title span{color:var(--ink-2);font-weight:400}
.bar .end{margin-inline-start:auto;position:relative;z-index:1;font-size:14px;color:var(--ink-2)}

/* progress strip, straight off the reference */
.strip[hidden]{display:none}
.strip{position:sticky;top:52px;z-index:35;display:flex;align-items:stretch;min-height:46px;
  background:var(--bg);border-bottom:1px solid #000}
.strip .count{min-width:92px;display:grid;place-items:center;font-size:20px;font-weight:600;
  font-variant-numeric:tabular-nums}
.clueline{flex:1;background:var(--panel-2);display:flex;align-items:center;gap:10px;
  padding:6px 12px;overflow-x:auto;overflow-y:hidden;white-space:nowrap}
.clueline .ct{font-size:14px;color:var(--ink);line-height:1.25;white-space:normal}
.clueline .ct.en{font-size:16px;font-weight:600;letter-spacing:.01em}
.clueline .sk{font-size:17px;letter-spacing:.12em;font-family:var(--display);direction:rtl;flex:none}
.clueline .sk u{text-decoration:none;color:var(--ink-3)}
.clueline .sk b{font-weight:600}
.clueline .sk s{text-decoration:none;color:var(--accent);padding:0 1px}

/* ---------- grid ---------- */
.board{overflow-x:auto;padding:0;background:var(--bg)}
#grid{display:grid;direction:rtl;width:max-content;margin:0 auto;
  border-top:1px solid var(--line);border-right:1px solid var(--line)}
.cell{width:var(--size);height:var(--size);position:relative;background:var(--cell);
  border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.cell.block{background:var(--block);border-color:var(--block)}
.cell.letter{cursor:pointer}
.cell.letter .ltr{position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--display);font-size:calc(var(--size)*.6);line-height:1;color:var(--ink)}
.cell.letter.ok .ltr{color:var(--good)}
.cell.letter.err .ltr{color:var(--bad)}
.cell.letter.given .ltr{color:var(--amber)}
.cell.letter.hl{background:#6F9C87}
.cell.letter.hl .ltr{color:#0B1512}
.cell.letter.cur{background:#BFE0F5;box-shadow:inset 0 0 0 2px var(--accent)}
.cell.letter.cur .ltr{color:#0B1A2A}

.cell.cluecell{background:var(--clue-bg);display:flex;flex-direction:column;cursor:pointer;overflow:hidden}
.cell.cluecell.hl{background:#B9B9BE}
.slot{flex:1 1 0;position:relative;display:flex;align-items:center;justify-content:center;
  padding:1px 3px;min-height:0;text-align:center}
.slot.en span{direction:ltr;unicode-bidi:isolate;font-weight:700;letter-spacing:0}
.slot.dir-a{padding-left:13px}
.slot.dir-d{padding-bottom:10px}
.slot+.slot{border-top:1px solid rgba(0,0,0,.35)}
.slot span{color:var(--clue-ink);line-height:1.06;font-weight:600;letter-spacing:-.01em;
  overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;word-break:break-word}
.slot small{font-weight:400;opacity:.85}
.slot i{position:absolute;font-style:normal;color:#fff;line-height:1;
  font-size:max(10px,calc(var(--size)*.26));text-shadow:0 0 2px rgba(0,0,0,.4)}
.slot i.left{left:1px;top:50%;transform:translateY(-50%)}
.slot i.down{bottom:0;left:50%;transform:translateX(-50%)}
.slot.on{background:rgba(10,132,255,.32)}
.slot.done::before{content:"✓";position:absolute;left:2px;bottom:0;font-size:max(9px,calc(var(--size)*.2));
  color:#1B8F45;line-height:1}

/* ---------- tools ---------- */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{padding:9px 15px;border-radius:9px;font-size:14px;background:var(--panel);color:var(--ink-2)}
.btn:hover{background:var(--panel-2);color:var(--ink)}
.btn.pri{background:var(--accent);color:#fff}

#kb{display:none;position:sticky;bottom:0;z-index:25;background:var(--panel);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom));margin:12px -14px 0;border-top:1px solid #000}
@media (max-width:820px){#kb{display:block}}
.kbrow{display:flex;justify-content:center;gap:4px;margin-bottom:4px}
.key{flex:1;max-width:40px;height:42px;border-radius:6px;background:var(--panel-2);
  font-family:var(--display);font-size:19px;display:grid;place-items:center}
.key:active{background:var(--accent)}
.key.wide{max-width:96px;font-family:var(--ui);font-size:13px;color:var(--ink-2)}

/* ---------- level map ---------- */
.hero{padding:26px 0 6px;max-width:56ch}
.hero h1{font-family:var(--display);font-weight:600;font-size:clamp(27px,5.4vw,40px);line-height:1.1;
  margin:0 0 8px;text-wrap:balance}
.hero p{margin:0;color:var(--ink-2);font-size:15px;line-height:1.55}
.overall{display:flex;align-items:center;gap:12px;margin:20px 0 26px;max-width:520px}
.overall .rail{flex:1;height:6px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.overall .rail i{display:block;height:100%;background:var(--clue-bg)}
.overall small{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.chapter{margin:0 0 30px}
.ch-head{display:flex;align-items:center;gap:11px;margin:0 0 12px}
.ch-num{font-size:12px;letter-spacing:.14em;color:var(--ink-3);border:1px solid var(--panel-2);
  border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
.ch-head h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.ch-head em{font-style:normal;font-size:12.5px;color:var(--ink-3)}
.ch-rule{flex:1;height:1px;background:var(--panel-2)}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:9px}
.lv{background:var(--panel);border-radius:10px;padding:11px 12px 9px;text-align:right;
  border:1px solid transparent;transition:transform .12s,border-color .12s}
.lv:hover:not(.locked){transform:translateY(-2px);border-color:var(--accent)}
.lv .n{font-family:var(--display);font-size:25px;line-height:1;font-variant-numeric:tabular-nums}
.lv .meta{margin-top:6px;font-size:11.5px;color:var(--ink-3)}
.lv.locked{opacity:.42;cursor:not-allowed}
.lv.done{border-color:var(--good)}
.lv.next{border-color:var(--amber)}
.stars{letter-spacing:1px;color:var(--amber);font-size:12px}
.stars .off{color:#48484A}

/* ---------- finish sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:50;padding:18px}
.scrim[hidden]{display:none}
.modal{background:var(--sheet);border:1px solid var(--panel-2);border-radius:14px;padding:22px;
  max-width:400px;width:100%;text-align:center}
.modal h3{font-family:var(--display);font-size:25px;margin:0 0 5px;font-weight:600}
.modal p{color:var(--ink-2);margin:0 0 10px;font-size:14.5px}
.bigstars{font-size:30px;color:var(--amber);letter-spacing:6px}
.bigstars .off{color:#48484A}
.words-learned{margin:12px 0 4px;text-align:right;border-top:1px solid var(--panel-2);padding-top:11px;
  display:grid;gap:6px;max-height:190px;overflow-y:auto}
.words-learned div{font-size:13.5px;color:var(--ink-2);line-height:1.4}
.words-learned b{font-family:var(--display);font-size:16px;color:var(--ink)}
.modal .row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:13px}
</style>

<div class="bar">
  <div class="bar-in">
    <button class="back" id="btnHome"><svg viewBox="0 0 12 19"><path d="M10.5 1.5 2 9.5l8.5 8"/></svg>חזור</button>
    <div class="bar-title" id="barTitle">תשחץ פסיכומטרי</div>
    <div class="end" id="barHints"></div>
  </div>
</div>
<div class="strip" id="strip" hidden>
  <div class="count" id="stCount">0/0</div>
  <div class="clueline">
    <span class="ct" id="clText"></span>
    <span class="sk" id="clSkel"></span>
  </div>
</div>

<main class="wrap" id="main">
  <section class="screen on" id="scMap">
    <div class="hero">
      <h1>אוצר המילים של הפסיכומטרי, שלב אחר שלב</h1>
      <p>כל שלב הוא תשחץ: ההגדרה יושבת במשבצת והחץ מראה לאן נכנסת התשובה. פותרים שלב — נפתח הבא, והמילים נעשות נדירות יותר.</p>
    </div>
    <div class="overall">
      <div class="rail"><i id="ovBar" style="width:0%"></i></div>
      <small id="ovTxt">0 מתוך 0</small>
    </div>
    <div id="chapters"></div>
  </section>

  <section class="screen" id="scPlay">
    <div class="board"><div id="grid" role="application" aria-label="רשת התשחץ"></div></div>
    <div class="tools">
      <button class="btn" id="btnLetter">חשוף אות</button>
      <button class="btn" id="btnWord">פתור מילה</button>
      <button class="btn" id="btnCheck">בדוק</button>
      <button class="btn" id="btnShuffle">ערבב מחדש</button>
    </div>
    <div id="kb"></div>
  </section>
</main>

<div class="scrim" id="scrim" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="bigstars" id="mdStars"></div>
    <h3 id="mdTitle">שלב הושלם</h3>
    <p id="mdSub"></p>
    <div class="words-learned" id="mdWords"></div>
    <div class="row">
      <button class="btn" id="mdMap">למפה</button>
      <button class="btn pri" id="mdNext">השלב הבא</button>
    </div>
  </div>
</div>

<script>
const RAW = `__BANK__`;

/* ---------- word bank ----------
   Each row is  level | language | clue | answer;answer;...
   A clue may have several accepted translations; the grid takes whichever one fits,
   the way a printed crossword commits to one sense of an ambiguous clue. */
const FIN={"ך":"כ","ם":"מ","ן":"נ","ף":"פ","ץ":"צ"};
const norm=s=>s.replace(/[ךםןףץ]/g,m=>FIN[m]);

/* A Hebrew definition has to fit inside one small square: keep the first sense or two
   and leave the full text to the bar above the grid. English clues are short already. */
function shortClue(s){
  const parts=s.split(/[;,]/).map(t=>t.trim()).filter(Boolean);
  let out=parts[0];
  if(out.length<=13&&parts[1]&&(out+", "+parts[1]).length<=25) out+=", "+parts[1];
  if(out.length>30){
    let acc="";
    for(const w of out.split(" ")){ if((acc+" "+w).trim().length>27) break; acc=(acc+" "+w).trim(); }
    out=acc+"…";
  }
  return out;
}
function answerOf(w){
  const words=norm(w.trim()).split(/\s+/);
  const splits=[]; let n=0;
  for(let i=0;i<words.length-1;i++){ n+=words[i].length; splits.push(n); }
  return {w:w.trim(), g:words.join(""), splits,
          pattern: words.length>1?" ("+words.map(x=>x.length).join(",")+")":""};
}
const ROWS=RAW.trim().split("\n").map(line=>{
  const [lv,lang,cl,ans]=line.split("|");
  return {lv:+lv, lang, cl,
          sc: lang==="en"?cl:shortClue(cl),
          answers: ans.split(";").filter(Boolean).map(answerOf)};
});
const PLAN=[];
ROWS.forEach(r=>{ (PLAN[r.lv]=PLAN[r.lv]||[]).push(r); });
const LEVELS=PLAN.length;
const PER_LEVEL=8;

function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- arrow-word builder ----------
   Every answer needs a clue square immediately before it: to its right for an across
   answer, above it for a down answer. One clue square can carry up to two clues. */
function build(core, extra, seed, span, maxTotal){
  const r=rng(seed);
  const bylen=(a,b)=>b.answers[0].g.length-a.answers[0].g.length||(r()-.5);
  const list=core.slice().sort(bylen).concat(extra.slice().sort(bylen));
  const cells=new Map();
  const placed=[];
  const usedClue=new Set(), usedWord=new Set();
  const K=(a,b)=>a+","+b, at=(a,b)=>cells.get(K(a,b));
  const box={r0:0,c0:0,r1:0,c1:0};
  const growth=(r0,c0,r1,c1)=>{
    const w=Math.max(box.c1,c1)-Math.min(box.c0,c0)+1, h=Math.max(box.r1,r1)-Math.min(box.r0,r0)+1;
    return w*h-(box.c1-box.c0+1)*(box.r1-box.r0+1);
  };
  function fits(w,r0,c0,dir){
    const L=w.length, dr=dir==="d"?1:0, dc=dir==="a"?1:0;
    const head=at(r0-dr,c0-dc);
    if(head&&(head.t!=="C"||head[dir]!=null)) return -1;
    const tail=at(r0+dr*L,c0+dc*L);
    if(tail&&tail.t==="L") return -1;
    let cross=0;
    for(let i=0;i<L;i++){
      const rr=r0+dr*i, cc=c0+dc*i, cell=at(rr,cc);
      if(cell){
        if(cell.t!=="L"||cell.ch!==w[i]) return -1;
        if(cell[dir]) return -1;
        cross++;
      }else{
        const p1=dir==="a"?at(rr-1,cc):at(rr,cc-1);
        const p2=dir==="a"?at(rr+1,cc):at(rr,cc+1);
        if((p1&&p1.t==="L")||(p2&&p2.t==="L")) return -1;
      }
    }
    return cross;
  }
  function put(entry,ans,r0,c0,dir){
    const w=ans.g, dr=dir==="d"?1:0, dc=dir==="a"?1:0;
    const hk=K(r0-dr,c0-dc);
    const head=cells.get(hk)||{t:"C",a:null,d:null};
    head[dir]=placed.length;
    cells.set(hk,head);
    for(let i=0;i<w.length;i++){
      const k=K(r0+dr*i,c0+dc*i);
      const cell=cells.get(k)||{t:"L",ch:w[i],a:false,d:false};
      cell.ch=w[i]; cell[dir]=true; cells.set(k,cell);
    }
    box.r0=Math.min(box.r0,r0-dr); box.c0=Math.min(box.c0,c0-dc);
    box.r1=Math.max(box.r1,r0+dr*(w.length-1)); box.c1=Math.max(box.c1,c0+dc*(w.length-1));
    placed.push({w:ans.w,g:w,splits:ans.splits,pattern:ans.pattern,
                 cl:entry.cl,sc:entry.sc,lang:entry.lang,core:entry.core,r:r0,c:c0,dir});
    usedClue.add(entry.cl); usedWord.add(w);
  }
  /* Best spot for one entry, considering every translation it accepts.
     Only an exam word may break out of the target square - mortar must stay inside,
     or the board sprawls and stops looking like a printed grid. */
  function best(entry,limitSpan,allowLoose){
    let win=null, loose=null;
    for(const ans of entry.answers){
      const w=ans.g;
      if(usedWord.has(w)) continue;
      for(const p of placed){
        const pdr=p.dir==="d"?1:0, pdc=p.dir==="a"?1:0;
        for(let i=0;i<p.g.length;i++) for(let j=0;j<w.length;j++){
          if(p.g[i]!==w[j]) continue;
          const dir=p.dir==="a"?"d":"a";
          const rr=p.r+pdr*i-(dir==="d"?j:0), cc=p.c+pdc*i-(dir==="a"?j:0);
          const cross=fits(w,rr,cc,dir);
          if(cross<=0) continue;
          const ddr=dir==="d"?1:0, ddc=dir==="a"?1:0;
          const r1=rr+ddr*(w.length-1), c1=cc+ddc*(w.length-1);
          const h=Math.max(box.r1,r1)-Math.min(box.r0,rr-ddr)+1;
          const wd=Math.max(box.c1,c1)-Math.min(box.c0,cc-ddc)+1;
          const cand={s:cross*cross*20-growth(rr-ddr,cc-ddc,r1,c1)*1.1+r(),ans,r:rr,c:cc,dir};
          if(h<=limitSpan&&wd<=limitSpan){ if(!win||cand.s>win.s) win=cand; }
          else if(h<=limitSpan+3&&wd<=limitSpan+3&&(!loose||cand.s>loose.s)) loose=cand;
        }
      }
    }
    return win||(allowLoose?loose:null);
  }

  const first=list[0];
  put(first,first.answers[0],0,1,"a");
  let pool=list.slice(1);
  for(let pass=0;pass<3&&pool.length;pass++){
    const left=[];
    for(const cand of pool){
      if(placed.length>=maxTotal||usedClue.has(cand.cl)){left.push(cand);continue;}
      const pick=best(cand,span,cand.core===true);
      if(pick) put(cand,pick.ans,pick.r,pick.c,pick.dir); else left.push(cand);
    }
    if(left.length===pool.length) break;
    pool=left;
  }

  /* mortar: pack the holes with nearby vocabulary, then seed fresh clusters in dead corners */
  const span2=Math.max(span,box.r1-box.r0+1,box.c1-box.c0+1);
  const bag=extra.filter(x=>!usedClue.has(x.cl));
  for(let i=bag.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}
  for(let guard=0;guard<120&&placed.length<maxTotal;guard++){
    let pick=null,who=null;
    for(const cand of bag){
      if(usedClue.has(cand.cl)) continue;
      const b=best(cand,span2,false);
      if(b&&(!pick||b.s>pick.s)){pick=b;who=cand;}
    }
    if(!pick){
      outer:
      for(let rr=box.r0;rr<=box.r1;rr++) for(let cc=box.c0;cc<=box.c1;cc++){
        if(at(rr,cc)) continue;
        for(const dd of ["a","d"]) for(const cand of bag.slice(0,70)){
          if(usedClue.has(cand.cl)) continue;
          for(const ans of cand.answers){
            if(usedWord.has(ans.g)) continue;
            const ddr=dd==="d"?1:0, ddc=dd==="a"?1:0;
            const r1=rr+ddr*(ans.g.length-1), c1=cc+ddc*(ans.g.length-1);
            if(Math.max(box.r1,r1)-Math.min(box.r0,rr-ddr)+1>span2) continue;
            if(Math.max(box.c1,c1)-Math.min(box.c0,cc-ddc)+1>span2) continue;
            if(fits(ans.g,rr,cc,dd)!==0) continue;
            pick={ans,r:rr,c:cc,dir:dd}; who=cand; break outer;
          }
        }
      }
    }
    if(!pick) break;
    put(who,pick.ans,pick.r,pick.c,pick.dir);
  }

  let minR=1e9,minC=1e9,maxR=-1e9,maxC=-1e9;
  cells.forEach((_,k)=>{const [a,b]=k.split(",").map(Number);
    minR=Math.min(minR,a);maxR=Math.max(maxR,a);minC=Math.min(minC,b);maxC=Math.max(maxC,b);});
  const rows=maxR-minR+1, cols=maxC-minC+1;
  const map=Array.from({length:rows},()=>Array(cols).fill(null));
  cells.forEach((v,k)=>{const [a,b]=k.split(",").map(Number);map[a-minR][b-minC]=v;});
  const entries=placed.map(p=>({...p,r:p.r-minR,c:p.c-minC}));
  return {rows,cols,map,entries,fill:cells.size/(rows*cols)};
}
let shuffleSalt=0;
/* Levels either side supply the mortar - meeting a word twice is good revision. */
function neighbours(k){
  const out=[];
  for(let d=-7;d<=7;d++){ const i=k+d; if(d&&i>=0&&i<LEVELS) out.push(...PLAN[i]); }
  return out;
}
const SPAN=13, MAX_WORDS=44;
function buildLevel(k){
  let best=null;
  const core=PLAN[k].map(x=>({...x,core:true}));
  const extra=neighbours(k).map(x=>({...x,core:false}));
  for(let t=0;t<6;t++){
    const g=build(core, t<2?[]:extra, (k+1)*7919+t*104729+shuffleSalt, SPAN, MAX_WORDS);
    if(!g) continue;
    const missing=core.length-g.entries.filter(e=>e.core).length;
    const over=Math.max(0,Math.max(g.rows,g.cols)-14);
    const s=g.fill*100+g.entries.length*2-missing*16-over*10;
    if(!best||s>best.s) best={g,s};
  }
  return best.g;
}

/* ---------- progress ---------- */
const KEY="hebArrowword.v1";
let save=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}})();
save.levels=save.levels||{}; save.xp=save.xp||0;
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};
const isDone=i=>!!save.levels[i];
const firstOpen=()=>{let i=0;while(i<LEVELS&&isDone(i))i++;return i;};

const CH_NAMES=["ראשית הדרך","מילים של יום־יום","לשון המקרא","שדה וכרם","רגש ומידה","מעשים ומלאכות",
  "משפט ושלטון","גוף ונפש","דימוי ומליצה","אותיות נדירות","מעמקי המילון","שיא האוצר"];
const $=id=>document.getElementById(id);
const show=id=>{document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));window.scrollTo(0,0);};

function renderMap(){
  const done=Object.keys(save.levels).length;
  $("ovBar").style.width=(done/LEVELS*100).toFixed(1)+"%";
  $("ovTxt").textContent=`${done} מתוך ${LEVELS} שלבים`;
  const open=firstOpen(), host=$("chapters"), per=10, chapters=Math.ceil(LEVELS/per);
  host.innerHTML="";
  for(let c=0;c<chapters;c++){
    const from=c*per, to=Math.min(LEVELS,from+per);
    const pool=PLAN.slice(from,to).flat();
    const share=Math.round(pool.filter(x=>x.lang==="en").length/pool.length*100);
    const sec=document.createElement("section");sec.className="chapter";
    sec.innerHTML=`<div class="ch-head"><span class="ch-num">${c+1}</span>
      <h2>${CH_NAMES[c%CH_NAMES.length]}</h2><em>${share}% אנגלית</em><span class="ch-rule"></span></div>
      <div class="levels"></div>`;
    const box=sec.querySelector(".levels");
    for(let i=from;i<to;i++){
      const rec=save.levels[i], locked=i>open;
      const b=document.createElement("button");
      b.className="lv"+(rec?" done":"")+(locked?" locked":"")+(i===open&&!rec?" next":"");
      b.disabled=locked;
      const st=rec?rec.stars:0;
      b.innerHTML=`<div class="n">${i+1}</div><div class="meta">${
        locked?"נעול":rec?`<span class="stars">${"★".repeat(st)}<span class="off">${"★".repeat(3-st)}</span></span>`
        :`${PLAN[i].length} מילות מבחן`}</div>`;
      b.onclick=()=>startLevel(i);
      box.appendChild(b);
    }
    host.appendChild(sec);
  }
}

/* ---------- play ---------- */
let G=null,LV=0,grid=[],given=[],locked=[],cur={r:0,c:0},dir="a",hints=0,t0=0,tick=null;
const mmss=ms=>{const t=Math.floor(ms/1000);
  return String(Math.floor(t/3600)).padStart(2,"0")+":"+String(Math.floor(t/60)%60).padStart(2,"0")+":"+String(t%60).padStart(2,"0");};
function clock(){ $("barTitle").innerHTML=`תשחץ ${LV+1} <span>| ${mmss(Date.now()-t0)}</span>`; }
function startLevel(i){
  LV=i; G=buildLevel(i);
  grid=G.map.map(row=>row.map(c=>c&&c.t==="L"?"":null));
  given=G.map.map(row=>row.map(()=>false));
  locked=G.map.map(row=>row.map(()=>false));
  hints=0;
  const first=G.entries[0];
  cur={r:first.r,c:first.c}; dir=first.dir;
  t0=Date.now(); clearInterval(tick); tick=setInterval(clock,1000); clock();
  $("strip").hidden=false;
  renderGrid(); show("scPlay"); fitCell(); paint();
}
function wordsAt(r,c){return G.entries.filter(e=>e.dir==="a"
  ? e.r===r&&c>=e.c&&c<e.c+e.g.length
  : e.c===c&&r>=e.r&&r<e.r+e.g.length);}
function curEntry(){const ws=wordsAt(cur.r,cur.c);return ws.find(e=>e.dir===dir)||ws[0];}
function fixDir(){const ws=wordsAt(cur.r,cur.c);if(ws.length&&!ws.some(e=>e.dir===dir))dir=ws[0].dir;}
function flip(){const ws=wordsAt(cur.r,cur.c);if(ws.length>1){dir=dir==="a"?"d":"a";paint();}}

function fitCell(){
  if(!G)return;
  const avail=document.querySelector(".board").clientWidth-2;
  const size=Math.max(38,Math.min(56,Math.floor(avail/G.cols)));
  $("grid").style.setProperty("--size",size+"px");
}
addEventListener("resize",fitCell);
/* Short clues are set big, the way the printed squares do it; long ones shrink to fit. */
function clueSize(len,slots){
  const base = len<=5 ? .30 : len<=9 ? .215 : len<=15 ? .175 : len<=24 ? .148 : .128;
  return `calc(var(--size) * ${(base*(slots>1?.82:1)).toFixed(3)})`;
}
function renderGrid(){
  const g=$("grid");
  g.style.gridTemplateColumns=`repeat(${G.cols},var(--size))`;
  g.innerHTML="";
  for(let r=0;r<G.rows;r++)for(let c=0;c<G.cols;c++){
    const cell=G.map[r][c];
    const d=document.createElement("div");
    d.dataset.r=r; d.dataset.c=c;
    if(!cell){ d.className="cell block"; }
    else if(cell.t==="L"){
      d.className="cell letter";
      d.innerHTML='<span class="ltr"></span>';
      d.onclick=()=>{ if(cur.r===r&&cur.c===c) flip();
        else{cur={r,c};fixDir();paint();} };
    }else{
      d.className="cell cluecell";
      const slots=[];
      if(cell.a!=null) slots.push({dir:"a",i:cell.a});
      if(cell.d!=null) slots.push({dir:"d",i:cell.d});
      d.innerHTML=slots.map(s=>{
        const e=G.entries[s.i], text=e.sc+e.pattern;
        return `<div class="slot dir-${s.dir} ${e.lang}" data-e="${s.i}" style="font-size:${clueSize(text.length,slots.length)}">`+
          `<span>${e.sc}${e.pattern?`<small>${e.pattern}</small>`:""}</span>`+
          `<i class="${s.dir==="a"?"left":"down"}">${s.dir==="a"?"◀":"▼"}</i></div>`;}).join("");
      d.onclick=ev=>{
        const slot=ev.target.closest(".slot")||d.querySelector(".slot");
        const e=G.entries[+slot.dataset.e];
        cur={r:e.r,c:e.c}; dir=e.dir; paint();
      };
    }
    g.appendChild(d);
  }
}
/* The word break lives here, above the board, not as a line inside the squares. */
function skeleton(e){
  const dr=e.dir==="d"?1:0, dc=e.dir==="a"?1:0;
  let out="";
  for(let i=0;i<e.g.length;i++){
    if(e.splits.includes(i)) out+="<s>-</s>";
    const v=grid[e.r+dr*i][e.c+dc*i];
    out += v ? `<b>${v}</b>` : "<u>_</u>";
  }
  return out;
}
function solved(e){
  const dr=e.dir==="d"?1:0,dc=e.dir==="a"?1:0;
  for(let i=0;i<e.g.length;i++){
    const v=grid[e.r+dr*i][e.c+dc*i];
    if(!v||norm(v)!==e.g[i]) return false;
  }
  return true;
}
function paint(){
  const e=curEntry();
  const inWord=new Set();
  if(e){const dr=e.dir==="d"?1:0,dc=e.dir==="a"?1:0;
    for(let i=0;i<e.g.length;i++) inWord.add((e.r+dr*i)+","+(e.c+dc*i));}
  const done=new Set();
  G.entries.forEach(en=>{ if(solved(en)){
    const dr=en.dir==="d"?1:0,dc=en.dir==="a"?1:0;
    for(let i=0;i<en.g.length;i++){
      const rr=en.r+dr*i, cc=en.c+dc*i;
      done.add(rr+","+cc); locked[rr][cc]=true;      // a correct answer is final
    }}});
  $("grid").querySelectorAll(".cell.letter").forEach(d=>{
    const r=+d.dataset.r,c=+d.dataset.c,k=r+","+c,isCur=r===cur.r&&c===cur.c;
    d.classList.toggle("hl",inWord.has(k)&&!isCur);
    d.classList.toggle("cur",isCur);
    d.classList.toggle("ok",done.has(k));
    d.classList.toggle("given",given[r][c]);
    d.classList.remove("err");
    d.querySelector(".ltr").textContent=grid[r][c]||"";
  });
  $("grid").querySelectorAll(".cell.cluecell").forEach(d=>{
    let on=false;
    d.querySelectorAll(".slot").forEach(s=>{
      const en=G.entries[+s.dataset.e], sel=en===e;
      s.classList.toggle("on",sel); if(sel) on=true;
      s.classList.toggle("done",solved(en));
    });
    d.classList.toggle("hl",on);
  });
  if(e){
    const t=$("clText");
    t.textContent=e.cl+(e.pattern||"")+":";
    t.dir=e.lang==="en"?"ltr":"rtl";
    t.classList.toggle("en",e.lang==="en");
    $("clSkel").innerHTML=skeleton(e);
  }
  const n=G.entries.filter(solved).length, all=G.entries.length;
  $("stCount").textContent=`${n}/${all}`;
  $("barHints").textContent=hints?`${hints} רמזים`:"";
}
function step(delta){
  const e=curEntry();if(!e)return;
  const dr=e.dir==="d"?1:0,dc=e.dir==="a"?1:0;
  const idx=e.dir==="a"?cur.c-e.c:cur.r-e.r;
  const ni=Math.min(e.g.length-1,Math.max(0,idx+delta));
  cur={r:e.r+dr*ni,c:e.c+dc*ni};
}
function type(ch){
  const cell=G&&G.map[cur.r][cur.c];
  if(!cell||cell.t!=="L")return;
  if(!given[cur.r][cur.c]&&!locked[cur.r][cur.c]) grid[cur.r][cur.c]=norm(ch);
  step(1); paint(); checkDone();
}
function erase(){
  if(!G)return;
  const free=(r,c)=>!given[r][c]&&!locked[r][c];
  if(grid[cur.r][cur.c]&&free(cur.r,cur.c)) grid[cur.r][cur.c]="";
  else{step(-1); if(free(cur.r,cur.c)) grid[cur.r][cur.c]="";}
  paint();
}
addEventListener("keydown",ev=>{
  if(!$("scPlay").classList.contains("on")||!$("scrim").hidden)return;
  const k=ev.key;
  if(/^[א-ת]$/.test(k)){ev.preventDefault();type(k);return;}
  if(k==="Backspace"){ev.preventDefault();erase();return;}
  if(k===" "){ev.preventDefault();flip();return;}
  const mv={ArrowRight:[0,-1],ArrowLeft:[0,1],ArrowUp:[-1,0],ArrowDown:[1,0]}[k];
  if(mv){ev.preventDefault();
    let r=cur.r+mv[0],c=cur.c+mv[1];
    while(r>=0&&c>=0&&r<G.rows&&c<G.cols&&!(G.map[r][c]&&G.map[r][c].t==="L")){r+=mv[0];c+=mv[1];}
    if(r>=0&&c>=0&&r<G.rows&&c<G.cols){cur={r,c};dir=mv[0]!==0?"d":"a";fixDir();paint();}
  }
});
(function(){
  const kb=$("kb");
  ["קראטוןםפ","שדגכעיחלך","זסבהנמצתץ"].forEach(row=>{
    const d=document.createElement("div");d.className="kbrow";
    [...row].forEach(ch=>{const b=document.createElement("button");b.className="key";b.textContent=ch;
      b.onclick=()=>type(ch);d.appendChild(b);});
    kb.appendChild(d);
  });
  const last=document.createElement("div");last.className="kbrow";
  const sw=document.createElement("button");sw.className="key wide";sw.textContent="החלף כיוון";sw.onclick=flip;
  const del=document.createElement("button");del.className="key wide";del.textContent="מחיקה";del.onclick=erase;
  last.append(sw,del);kb.appendChild(last);
})();

$("btnLetter").onclick=()=>{
  const e=curEntry();if(!e)return;
  const dr=e.dir==="d"?1:0,dc=e.dir==="a"?1:0;
  for(let i=0;i<e.g.length;i++){
    const r=e.r+dr*i,c=e.c+dc*i;
    if(!grid[r][c]||norm(grid[r][c])!==e.g[i]){grid[r][c]=e.g[i];given[r][c]=true;hints++;paint();checkDone();return;}
  }
};
$("btnWord").onclick=()=>{
  const e=curEntry();if(!e)return;
  const dr=e.dir==="d"?1:0,dc=e.dir==="a"?1:0;
  for(let i=0;i<e.g.length;i++){
    const r=e.r+dr*i,c=e.c+dc*i;
    if(!given[r][c]&&norm(grid[r][c]||"")!==e.g[i]) hints++;
    grid[r][c]=e.g[i];given[r][c]=true;
  }
  paint();checkDone();
};
$("btnCheck").onclick=()=>{
  let bad=0;
  $("grid").querySelectorAll(".cell.letter").forEach(d=>{
    const r=+d.dataset.r,c=+d.dataset.c;
    if(grid[r][c]&&norm(grid[r][c])!==G.map[r][c].ch){d.classList.add("err");bad++;}
  });
  $("clText").textContent=bad?`${bad} אותיות שגויות מסומנות באדום`:"כל מה שמילאת נכון עד כה";
  $("clSkel").innerHTML="";
};
$("btnShuffle").onclick=()=>{shuffleSalt=Math.floor(Math.random()*1e6);startLevel(LV);};
$("btnHome").onclick=()=>{clearInterval(tick);$("strip").hidden=true;
  $("barTitle").textContent="תשחץ פסיכומטרי";$("barHints").textContent="";
  renderMap();show("scMap");};

function checkDone(){
  if(!G.entries.every(solved))return;
  clearInterval(tick);
  const elapsed=Date.now()-t0;
  const stars=hints===0?3:hints<=2?2:1;
  const xp=Math.max(10,40+G.entries.length*6-hints*5);
  const prev=save.levels[LV];
  if(!prev||prev.stars<stars) save.levels[LV]={stars,hints};
  save.xp+=xp; persist();
  $("mdStars").innerHTML="★".repeat(stars)+`<span class="off">${"★".repeat(3-stars)}</span>`;
  $("mdTitle").textContent="שלב "+(LV+1)+" הושלם";
  $("mdSub").textContent=`${mmss(elapsed)} · ${hints===0?"בלי רמזים":hints+" רמזים"} · ‎+${xp} נקודות`;
  $("mdWords").innerHTML=G.entries.filter(e=>e.core)
    .map(e=>`<div><b>${e.w}</b> — <span dir="${e.lang==="en"?"ltr":"rtl"}">${e.cl}</span></div>`).join("");
  $("mdNext").style.display=LV+1<LEVELS?"":"none";
  $("scrim").hidden=false;
}
$("mdMap").onclick=()=>{$("scrim").hidden=true;$("strip").hidden=true;
  $("barTitle").textContent="תשחץ פסיכומטרי";$("barHints").textContent="";renderMap();show("scMap");};
$("mdNext").onclick=()=>{$("scrim").hidden=true;startLevel(Math.min(LEVELS-1,LV+1));};

renderMap();
</script>
